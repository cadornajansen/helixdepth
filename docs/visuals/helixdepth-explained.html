<text x="70" y="145" font-size="54" fill="#152A35" font-weight="700" text-anchor="start">More processing. Reused weights.</text>
<text x="70" y="195" font-size="26" fill="#5F737E" font-weight="400" text-anchor="start">Can a small language model improve by reusing its Transformer blocks?</text>

<text x="128" y="410" font-size="21" fill="#5F737E" font-weight="400" text-anchor="start">A language model learns to predict the next token — a numbered piece of text.</text>
