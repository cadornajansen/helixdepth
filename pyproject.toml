[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "helixdepth"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["torch==2.8.0", "PyYAML==6.0.2", "pytest==8.4.2", "datasets==5.0.1", "tokenizers==0.23.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
